<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20">
  <title id="t">speed-watchdog demo terminal</title>
  <desc id="d">A terminal session: validate lints the three configured probes, then the report catches one hook, context_inject, thirty-four percent slower than its frozen baseline while the other two stay flat.</desc>
  <style>
    .p { fill: #7ee2a8; }
    .cmd { fill: #e8eef5; }
    .dim { fill: #9fb0c0; }
    .bad { fill: #ff9494; }
    .good { fill: #7ee2a8; }
  </style>
  <rect width="660" height="460" rx="14" fill="#0b0f14"/>
  <rect width="660" height="40" rx="14" fill="#11161d"/>
  <rect y="26" width="660" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">taste, enforced</text>
  <text x="24" y="80"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 watchdog.py validate --config demo/watchdog.json</tspan></text>
  <text x="24" y="112" class="good">config OK: 3 probes, 3 runs each, 7-day window</text>
  <text x="24" y="144" class="dim">  rules_lint      command: sh hooks/load-rules.sh</text>
  <text x="24" y="176" class="dim">  payload_check   command: sh hooks/check-payload.sh</text>
  <text x="24" y="208" class="dim">  context_inject  command: sh hooks/inject-context.sh</text>
  <text x="24" y="240"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 watchdog.py report --config demo/watchdog.json \</tspan></text>
  <text x="24" y="272" class="cmd">    --now 2026-06-14</text>
  <text x="24" y="304" class="dim">speed-watchdog  window=7d  now=2026-06-14  baseline frozen…</text>
  <text x="24" y="336" class="good">  ok    rules_lint      recent 18.1 ms   baseline 18.0 ms…</text>
  <text x="24" y="368" class="good">  ok    payload_check   recent 42.0 ms   baseline 41.9 ms…</text>
  <text x="24" y="400" class="bad">  ALARM context_inject  recent 80.4 ms   baseline 60.1 ms…</text>
  <text x="24" y="432" class="bad">ALARM: 1 probe(s) slower than the frozen baseline.</text>
</svg>