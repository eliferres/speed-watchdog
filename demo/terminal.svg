<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 604" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16">
  <title id="t">speed-watchdog demo terminal</title>
  <desc id="d">A terminal session: validate lints the three configured probes, then the report catches one hook, context_inject, thirty-four percent slower than its frozen baseline while rules_lint and payload_check stay flat.</desc>
  <style>
    .p { fill: #7ee2a8; }
    .cmd { fill: #e8eef5; }
    .dim { fill: #9fb0c0; }
    .bad { fill: #ff9494; }
    .good { fill: #7ee2a8; }
  </style>
  <rect width="660" height="604" rx="14" fill="#0b0f14"/>
  <rect width="660" height="40" rx="14" fill="#11161d"/>
  <rect y="26" width="660" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">speed-watchdog</text>
  <text x="24" y="72"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 speed_watchdog.py validate --config \</tspan></text>
  <text x="24" y="100" class="cmd">    demo/watchdog.json</text>
  <text x="24" y="128" class="good">config OK: 3 probes, 3 runs each, 7-day window</text>
  <text x="24" y="156" class="bad">  rules_lint  (alarm at +20%)</text>
  <text x="24" y="184" class="dim">    measures: wall-clock ms to read and lint the rules file…</text>
  <text x="24" y="212" class="dim">    command:  sh hooks/load-rules.sh</text>
  <text x="24" y="240" class="bad">  payload_check  (alarm at +20%)</text>
  <text x="24" y="268" class="dim">    measures: wall-clock ms for the pre-tool hook to inspec…</text>
  <text x="24" y="296" class="dim">    command:  sh hooks/check-payload.sh</text>
  <text x="24" y="324" class="bad">  context_inject  (alarm at +20%)</text>
  <text x="24" y="352" class="dim">    measures: wall-clock ms for the context-injection hook…</text>
  <text x="24" y="380" class="dim">    command:  sh hooks/inject-context.sh</text>
  <text x="24" y="408"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 speed_watchdog.py report --config \</tspan></text>
  <text x="24" y="436" class="cmd">    demo/watchdog.json --now 2026-06-14</text>
  <text x="24" y="464" class="dim">speed-watchdog  window=7d  now=2026-06-14  baseline frozen…</text>
  <text x="24" y="492" class="good">  ok    rules_lint               recent     18.1 ms   basel…</text>
  <text x="24" y="520" class="good">  ok    payload_check            recent     42.0 ms   basel…</text>
  <text x="24" y="548" class="bad">  ALARM context_inject           recent     80.4 ms   basel…</text>
  <text x="24" y="576" class="bad">ALARM: 1 probe(s) slower than the frozen baseline. Find wha…</text>
</svg>